<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Pro - Audio Engine Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .controls {
            margin: 2rem 0;
            display: flex;
            gap: 1rem;
            align-items: center;
            background: #222;
            padding: 1rem 2rem;
            border-radius: 8px;
            border: 1px solid #333;
        }
        select, button {
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        select:hover, button:hover {
            background: #444;
        }
        #keyboard {
            position: relative;
            height: 200px;
            display: flex;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #333;
            user-select: none;
        }
        .key {
            border: 1px solid #000;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .white-key {
            background: #fff;
            width: 40px;
            height: 100%;
            z-index: 1;
        }
        .white-key:active, .white-key.active {
            background: #e0e0e0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .black-key {
            background: #222;
            width: 24px;
            height: 60%;
            margin-left: -12px;
            margin-right: -12px;
            z-index: 2;
        }
        .black-key:active, .black-key.active {
            background: #444;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        #status {
            margin-top: 2rem;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Magic Pro</h1>
    <p>Unified Audio Engine Demo (SF2 + WAV Sampler)</p>

    <div class="controls">
        <button id="start-audio">Start Audio Engine</button>
        
        <div>
            <label for="ch1-instrument">Channel 1 (Master): </label>
            <select id="ch1-instrument" disabled>
                <option value="sf2:0">SF2: Acoustic Grand Piano</option>
                <option value="sf2:1">SF2: Nylon Guitar</option>
                <option value="sf2:2">SF2: Violin</option>
                <option value="wav:tabla">WAV Sampler: Tabla</option>
                <option value="wav:oud">WAV Sampler: Oud</option>
            </select>
        </div>

        <div>
            <label><input type="checkbox" id="layer-ch2" disabled> Layer with Ch 2 (Tabla)</label>
        </div>
    </div>

    <!-- 2 Octave Keyboard C4 - B5 -->
    <div id="keyboard" style="pointer-events: none; opacity: 0.5;">
        <!-- Generated by JS -->
    </div>

    <div id="status">Click "Start Audio Engine" to initialize Web Audio API</div>

    <script type="module">
        import { WavSampler, WAV_PRESETS } from './wav-sampler.js';
        import { SF2Engine } from './sf2-engine.js';
        import { InstrumentRouter } from './instrument-router.js';

        let audioCtx, sf2Engine, wavSampler, router;
        const statusEl = document.getElementById('status');
        const keyboardEl = document.getElementById('keyboard');
        const startBtn = document.getElementById('start-audio');
        const ch1Select = document.getElementById('ch1-instrument');
        const layerCheck = document.getElementById('layer-ch2');
        
        // Root note C4 = 60
        const START_NOTE = 60;
        const NUM_KEYS = 25; // 2 octaves + 1 note

        startBtn.addEventListener('click', async () => {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                statusEl.innerText = "Initializing engines...";
                
                sf2Engine = new SF2Engine(audioCtx);
                wavSampler = new WavSampler(audioCtx);
                router = new InstrumentRouter(audioCtx, sf2Engine, wavSampler);
                
                router.connectOutput(audioCtx.destination);
                
                // Initialize modules
                statusEl.innerText = "Loading SoundFonts & Samples...";
                await sf2Engine.loadFont("default");
                
                // Load Tabla into Ch2 by default for layering
                router.assignChannel(2, 'wav', WAV_PRESETS.tabla);
                
                // Connect MIDI
                await router.connectMIDI();
                
                statusEl.innerText = "Ready! Play using mouse or MIDI keyboard.";
                
                // Enable UI
                startBtn.style.display = 'none';
                ch1Select.disabled = false;
                layerCheck.disabled = false;
                keyboardEl.style.pointerEvents = 'auto';
                keyboardEl.style.opacity = '1';
                
                // Trigger initial selection
                ch1Select.dispatchEvent(new Event('change'));

            } catch (err) {
                statusEl.innerText = `Error: ${err.message}`;
            }
        });

        ch1Select.addEventListener('change', (e) => {
            if (!router) return;
            const [engine, val] = e.target.value.split(':');
            
            if (engine === 'sf2') {
                router.assignChannel(1, 'sf2', parseInt(val));
            } else if (engine === 'wav') {
                const preset = WAV_PRESETS[val];
                router.assignChannel(1, 'wav', preset);
            }
        });

        layerCheck.addEventListener('change', (e) => {
            if (!router) return;
            if (e.target.checked) {
                router.enableLayer(1, 2);
            } else {
                // simple hack to disable layer for demo
                router.channels.get(1).layers = [];
            }
        });

        // Build Visual Keyboard
        function isBlackKey(note) {
            const n = note % 12;
            return n === 1 || n === 3 || n === 6 || n === 8 || n === 10;
        }

        for (let i = 0; i < NUM_KEYS; i++) {
            const midiNote = START_NOTE + i;
            const key = document.createElement('div');
            const isBlack = isBlackKey(midiNote);
            
            key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
            key.dataset.note = midiNote;
            
            key.addEventListener('mousedown', () => {
                key.classList.add('active');
                if (router) router.triggerNoteOn(1, midiNote, 100);
            });
            
            key.addEventListener('mouseup', () => {
                key.classList.remove('active');
                if (router) router.triggerNoteOff(1, midiNote);
            });
            
            key.addEventListener('mouseleave', () => {
                if (key.classList.contains('active')) {
                    key.classList.remove('active');
                    if (router) router.triggerNoteOff(1, midiNote);
                }
            });
            
            keyboardEl.appendChild(key);
        }

    </script>
</body>
</html>
